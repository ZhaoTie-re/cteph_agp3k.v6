# Gene / pathway themes of the genetic studies of CTEPH.
#
# They group the literature findings in workbook sheet "3 CTEPH genetics" and
# knowledge-base section 4: theme > gene > finding. This is an editorial
# grouping, reviewed by hand.
#
# Rules (ot_common.assign_themes):
#   - a gene belongs to the first theme that lists it;
#   - a finding without a gene symbol joins the first theme whose genes or
#     `words` occur in its gene text (for example "CH-associated genes");
#   - other findings go under "Other genes" (a symbol no theme lists) or
#     "No gene named". The build logs every gene that falls into "Other genes",
#     so that a new snapshot's genes can be placed here.
themes:
- key: fibrinogen
  name: Fibrinogen
  description: Fibrinogen genes, among them the FGA Thr312Ala variant and the FGG locus of the GWAS.
  genes: [FGA, FGB, FGG, MIR759]

- key: vwf_fviii_fxi
  name: ABO, von Willebrand factor, factor VIII and factor XI
  description: Genes that set plasma von Willebrand factor, factor VIII and factor XI levels; STAB2 clears von
    Willebrand factor.
  genes: [ABO, VWF, F8, ADAMTS13, STAB2, F11]

- key: coagulation
  name: Inherited thrombophilia and other haemostasis genes
  description: Classic thrombophilia (factor V Leiden, prothrombin G20210A, protein C / S, antithrombin), fibrinolysis
    and other venous-thrombosis genes.
  genes: [F5, F2, PROC, PROS1, SERPINC1, THBD, F12, F13A1, F13B, KNG1, SERPIND1, SERPINE1, PLAT, PLG, CPB2, MTHFR,
          TSPAN15, SLC44A2]

- key: hla_immunity
  name: HLA and immunity
  description: HLA alleles, among them the Japanese HLA-B*52:01 / DPB1*02:02 associations, and immune genes.
  genes: [HLA-A, HLA-B, HLA-C, HLA-DPB1, HLA-DQB1, HLA-DRA, HLA-DRB1, NFKBIL1, CLEC7A, TNFSF13B, CTSS, FGR, ETS1]

- key: clonal
  name: Clonal haematopoiesis, myeloproliferative and platelet-production genes
  description: Acquired variants (JAK2 V617F, clonal haematopoiesis) and germline genes of platelet production.
  genes: [JAK2, CALR, MPL, THPO, NFE2, ETV6, TET2, DNMT3A, ASXL1, RUNX1, TP53, PPM1D, SF3B1, SRSF2, U2AF1]
  words: [clonal, CH-associated, CHIP]

- key: pah
  name: Pulmonary arterial hypertension genes
  description: Genes of heritable pulmonary arterial hypertension, tested in CTEPH.
  genes: [BMPR2, ACVRL1, ENG, SMAD9, SMAD4, SMAD1, CAV1, KCNK3, SOX17, GDF2, TBX4, EIF2AK4, ATP13A3, AQP1, RNF213,
          RASA1, CBLN2]

- key: vascular
  name: Endothelium, platelets and vascular tone
  description: Endothelial, platelet-receptor and vasoactive genes, among them genes associated with outcome rather
    than risk (ACE, GNB3).
  genes: [GP6, ICAM1, NOS3, ACE, GNB3, SLC6A4, HTR2A, PTGIS, ANO1, STIM1]

- key: pharmacogenetics
  name: Anticoagulant pharmacogenetics
  description: Genes of warfarin dosing.
  genes: [VKORC1, CYP2C9, CYP4F2]
